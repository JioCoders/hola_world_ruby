name: Ruby Gem

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build + Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # Required if using modern secure publishing platforms

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2' # Upgraded from 2.6 to natively support API key pushes and modern security TLS

    - name: Publish to GPR
      run: |
        mkdir -p $HOME/.gem
        # The key name inside credentials must be literal string matching the config
        printf -- "---\n:github: Bearer %s\n" "${{ secrets.GITHUB_TOKEN }}" > $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        
        gem build jio_hola_world.gemspec
        # --KEY must reference the exact key namespace defined in the file above
        gem push --KEY github --host https://rubygems.pkg.github.com/${{ github.repository_owner }} jio_hola_world-*.gem

    - name: Publish to RubyGems
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        mkdir -p $HOME/.gem
        printf -- "---\n:rubygems_api_key: %s\n" "${{ secrets.RUBYGEMS_AUTH_TOKEN }}" > $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        
        gem build jio_hola_world.gemspec
        # ADD THIS EXTENSION: --otp is not needed when MFA level is set to 'Applicable' 
        # on the key, but we pass an empty check or use the environment variable trick:
        GEM_HOST_API_KEY="${{ secrets.RUBYGEMS_AUTH_TOKEN }}" gem push jio_hola_world-*.gem
