    # - name: Publish to RubyGems
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    #   run: |
    #     gem build jio_hola_world.gemspec
    #     gem push jio_hola_world-*.gem
    #   env:
    #     GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}

    # - name: Install dependencies
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    #   run: bundle install

    # - name: Publish to RubyGems via Trusted Publishing
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    #   uses: rubygems/release-gem@v1  # Officially managed step that handles OIDC tokens automatically


    - name: Publish to RubyGems
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        # Leverage your saved repository secret instead of interactive OIDC setups
        mkdir -p $HOME/.gem
        printf -- "---\n:rubygems_api_key: %s\n" "${{ secrets.RUBYGEMS_AUTH_TOKEN }}" > $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        
        gem build jio_hola_world.gemspec
        gem push jio_hola_world-*.gem